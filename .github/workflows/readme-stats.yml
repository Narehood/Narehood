name: Update README stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/readme-stats.yml"
      - "scripts/patch_stats_commits.py"
      - "scripts/generate_top_langs.py"

concurrency:
  group: profile-readme-updates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_rank=true&custom_title=Stats&theme=dark&hide_border=true&bg_color=0d1117&title_color=58a6ff&icon_color=58a6ff&text_color=c9d1d9
          path: profile/stats.svg
          token: ${{ secrets.GH_PAT }}

      - name: Patch yearly + lifetime commits
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python3 scripts/patch_stats_commits.py

      - name: Generate top languages (includes forks)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/generate_top_langs.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --staged --quiet; then
            echo "No stats card changes"
            exit 0
          fi
          git commit -m "chore: update README stats cards"
          git pull --rebase origin main
          git push
