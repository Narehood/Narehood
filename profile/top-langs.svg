<svg
  width="300"
  height="215"
  viewBox="0 0 300 215"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Most used languages including forks and private repositories</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #58a6ff;
    }
    .lang-name {
      font: 400 14px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #c9d1d9;
    }
  </style>
  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="4.5"
    height="99%"
    stroke="#e4e2e2"
    width="299"
    fill="#0d1117"
    stroke-opacity="0"
  />
  <text x="25" y="35" class="header" data-testid="header">Most Used Languages</text>
  <svg data-testid="lang-items" x="0" y="45">
    <mask id="rect-mask">
      <rect x="25" y="0" width="250" height="8" fill="white" rx="5"/>
    </mask>
    <g mask="url(#rect-mask)">
      <rect height="8" x="25.00" width="176.99" fill="#3178c6"/><rect height="8" x="201.99" width="24.06" fill="#00ADD8"/><rect height="8" x="226.05" width="20.78" fill="#7355dd"/><rect height="8" x="246.83" width="8.46" fill="#e34c26"/><rect height="8" x="255.30" width="6.07" fill="#00B4AB"/><rect height="8" x="261.36" width="3.46" fill="#438eff"/><rect height="8" x="264.82" width="2.83" fill="#f1e05a"/><rect height="8" x="267.65" width="2.79" fill="#89e051"/><rect height="8" x="270.44" width="2.39" fill="#fcb32c"/><rect height="8" x="272.83" width="2.17" fill="#3572A5"/>
    </g>
    
      <g transform="translate(25, 45)">
        <circle cx="5" cy="6" r="5" fill="#3178c6"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">TypeScript 70.80%</text>
      </g>
      <g transform="translate(25, 69)">
        <circle cx="5" cy="6" r="5" fill="#00ADD8"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Go 9.63%</text>
      </g>
      <g transform="translate(25, 93)">
        <circle cx="5" cy="6" r="5" fill="#7355dd"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">C# 8.31%</text>
      </g>
      <g transform="translate(25, 117)">
        <circle cx="5" cy="6" r="5" fill="#e34c26"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">HTML 3.39%</text>
      </g>
      <g transform="translate(25, 141)">
        <circle cx="5" cy="6" r="5" fill="#00B4AB"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Dart 2.43%</text>
      </g>
      <g transform="translate(165, 45)">
        <circle cx="5" cy="6" r="5" fill="#438eff"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Objective-C 1.38%</text>
      </g>
      <g transform="translate(165, 69)">
        <circle cx="5" cy="6" r="5" fill="#f1e05a"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">JavaScript 1.13%</text>
      </g>
      <g transform="translate(165, 93)">
        <circle cx="5" cy="6" r="5" fill="#89e051"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Shell 1.12%</text>
      </g>
      <g transform="translate(165, 117)">
        <circle cx="5" cy="6" r="5" fill="#fcb32c"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">MDX 0.96%</text>
      </g>
      <g transform="translate(165, 141)">
        <circle cx="5" cy="6" r="5" fill="#3572A5"/>
        <text data-testid="lang-name" x="15" y="10" class="lang-name">Python 0.87%</text>
      </g>
  </svg>
</svg>
